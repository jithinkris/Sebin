<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLIVE Band Albums</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #111;
      color: #f0f0f0;
      margin: 0;
      padding: 0;
    }

    /* Navigation Styles */
    nav {
      background-color: #222;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      font-size: 1.5em;
      font-weight: bold;
      color: #00ffe7;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      color: #f0f0f0;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav ul li a:hover {
      color: #00ffe7;
    }

    h1 {
      text-align: center;
      margin: 40px 0 30px;
    }

    .album {
      margin-bottom: 40px;
      padding: 0 20px;
    }

    iframe {
      width: 100%;
      max-width: 560px;
      height: 315px;
      border-radius: 12px;
      display: block;
      margin: 10px auto;
    }

    a {
      color: #00ffe7;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <div class="logo">GLIVE</div>
    <ul>

</html>
